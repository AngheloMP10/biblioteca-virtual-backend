spring.datasource.url=${DB_URL_LOCAL}

spring.datasource.username=${DB_USERNAME_LOCAL}

spring.datasource.password=${DB_PASSWORD_LOCAL}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

jwt.secret=${JWT_SECRET_LOCAL}
jwt.expiration=8640000

cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME_LOCAL}
cloudinary.api_key=${CLOUDINARY_API_KEY_LOCAL}
cloudinary.api_secret=${CLOUDINARY_API_SECRET_LOCAL}